<!-- Section: Design Block -->
<section class="background-radial-gradient overflow-hidden">
    <div class="container text-center text-lg-start my-5">
        <div class="row align-items-center principal">
            <div class="col-lg-6" style="z-index: 10">
                <h1 class="display-5 fw-bold ls-tight" style="color: hsl(240, 95%, 69%)">
                    Dashboard<br />
                    <span style="color: hsl(218, 81%, 75%)"> - B2B -</span>
                </h1>
                <p class="opacity-70" style="color: hsl(219, 58%, 56%)">
                    Reporte de ventas de Cerámicas Kantu SAC y Decor San Blas SAC en Promart, Sodimac y Maestro.
                </p>
            </div>

            <div class="col-lg-6 position-relative">
                <div id="radius-shape-1" class="position-absolute rounded-circle shadow-5-strong"></div>
                <div id="radius-shape-2" class="position-absolute shadow-5-strong"></div>

                <div class="card bg-glass">
                    <div class="card-body px-sm-0 px-md-4 px-lg-4 px-xl-5 py-sm-0 py-md-4 py-lg-4 py-xl-5">
                        <div class="row">
                            <div class="col d-flex justify-content-center pb-3">
                                <h1 style="color: #5c5b5b;">Ingrese sus Credenciales</h1>
                            </div>
                        </div>
                        <!-- input correo-->
                        <div class="form-outline mb-4">
                            <input type="email" id="TxbUsuario" class="form-control" (keyup.enter)="this.IniciarSesion()"/>
                            <label class="form-label" for="ce">Correo electrónico</label>
                        </div>
                        <!-- input contraseña-->
                        <div class="form-outline">
                            <input type="password" id="TxbPass" class="form-control" (keyup.enter)="this.IniciarSesion()"/>
                            <label class="form-label" for="pass">Contraseña</label>
                        </div>
                        <!-- Checkbox -->
                        <div class="mb-3">
                            <label style="color: #d30000; font-size: 12px; transition: .3s;" id="LblError">
                                <!-- El usuario o Contraseña son incorrectos -->
                            </label>
                        </div>
                        <!-- button control submit-->
                        <div class="d-flex justify-content-center mb-4">
                            <label style="color: #707070; text-align: center;">
                                <p>
                                    ¿Tiene problemas para conectarse? Comunícate con el administrador de tu dominio para
                                obtener más información.
                                </p>
                                <div id="spinner_carga" class="visually-hidden" style="display: grid; grid-template-columns: repeat(1,1); align-items: center; justify-items: center;">
                                    <div class="spinner-border text-info" role="status">
                                    </div>
                                    <span class="">Verificando...</span>
                                </div>
                            </label>
                        </div>
                        <div class="d-flex justify-content-center">
                            <div class="row">
                                <button type="submit" class="btn btn-primary mb-4 d-flex" id="BtnIngresar" style="background-color: #384CFF;" (click)="IniciarSesion()">
                                    Iniciar Sesión
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Section: Design Block -->
